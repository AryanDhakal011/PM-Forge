<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0e4"/>
      <stop offset="0.62" stop-color="#f3ebdd"/>
      <stop offset="1" stop-color="#e9dfce"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#fff8e9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff8e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8bc84"/>
      <stop offset="0.48" stop-color="#b18a50"/>
      <stop offset="1" stop-color="#8d6a3b"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.42" stop-color="#cfc9bb"/>
      <stop offset="0.7" stop-color="#8f8b81"/>
      <stop offset="1" stop-color="#ece6d8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- workbench edge -->
  <path d="M0 520 C260 500 470 540 720 522 C930 507 1080 520 1200 505 L1200 630 L0 630 Z" fill="#d8c6ad" opacity="0.55"/>
  <path d="M0 561 C250 540 500 575 760 552 C980 533 1110 552 1200 540 L1200 630 L0 630 Z" fill="#8c6447" opacity="0.22"/>

  <!-- decision engine -->
  <g transform="translate(916 312)">
    <ellipse cx="0" cy="126" rx="188" ry="34" fill="#5a4030" opacity="0.18" filter="url(#soft)"/>
    <ellipse cx="0" cy="0" rx="186" ry="186" fill="none" stroke="url(#brass)" stroke-width="2" opacity="0.34"/>
    <ellipse cx="0" cy="0" rx="150" ry="150" fill="none" stroke="url(#brass)" stroke-width="1.4" opacity="0.55"/>
    <ellipse cx="0" cy="-8" rx="120" ry="42" fill="none" stroke="url(#brass)" stroke-width="10"/>
    <ellipse cx="0" cy="34" rx="126" ry="44" fill="none" stroke="url(#brass)" stroke-width="8" opacity="0.78"/>
    <ellipse cx="0" cy="74" rx="110" ry="38" fill="none" stroke="url(#brass)" stroke-width="5" opacity="0.5"/>
    <circle cx="0" cy="24" r="44" fill="url(#chrome)" stroke="#6c665b" stroke-width="1.2"/>
    <circle cx="0" cy="24" r="30" fill="none" stroke="#f7f0e4" stroke-width="1" opacity="0.65"/>
    <circle cx="-12" cy="12" r="9" fill="#fffdf7" opacity="0.85"/>
    <circle cx="140" cy="44" r="8" fill="#b85f45"/>
    <circle cx="140" cy="44" r="17" fill="none" stroke="#b85f45" stroke-width="1.4" opacity="0.5"/>

    <!-- evidence cards -->
    <g transform="translate(-202 -62) rotate(-9)">
      <rect width="94" height="112" rx="3" fill="#fbf8f0" stroke="#d5c9b7"/>
      <rect x="10" y="12" width="26" height="6" fill="#b18a50" opacity="0.7"/>
      <rect x="10" y="28" width="62" height="4" fill="#b9ad9c"/>
      <rect x="10" y="38" width="52" height="4" fill="#cfc5b6"/>
      <rect x="10" y="54" width="70" height="1" fill="#e5dccf"/>
      <rect x="10" y="64" width="40" height="4" fill="#cfc5b6"/>
    </g>
    <g transform="translate(126 -102) rotate(7)">
      <rect width="84" height="98" rx="3" fill="#fbf8f0" stroke="#d5c9b7"/>
      <rect x="9" y="11" width="22" height="6" fill="#899477" opacity="0.8"/>
      <rect x="9" y="25" width="56" height="4" fill="#b9ad9c"/>
      <rect x="9" y="35" width="44" height="4" fill="#cfc5b6"/>
      <rect x="9" y="50" width="62" height="1" fill="#e5dccf"/>
      <rect x="9" y="60" width="34" height="4" fill="#cfc5b6"/>
    </g>
    <g transform="translate(-146 148) rotate(4)">
      <rect width="78" height="56" rx="2" fill="#fbf8f0" stroke="#d5c9b7"/>
      <rect x="8" y="10" width="34" height="4" fill="#b18a50" opacity="0.65"/>
      <rect x="8" y="21" width="58" height="3" fill="#cfc5b6"/>
      <rect x="8" y="30" width="46" height="3" fill="#d8cfc0"/>
    </g>
    <!-- annotation -->
    <path d="M-252 -146 C-196 -120 -150 -76 -118 -25" fill="none" stroke="#8c6447" stroke-width="1.2" opacity="0.55"/>
    <path d="M-130 -38 L-116 -22 L-136 -19" fill="none" stroke="#8c6447" stroke-width="1.2" opacity="0.55"/>
    <text x="-262" y="-158" font-family="Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#6b655b">EVIDENCE</text>
  </g>

  <!-- type -->
  <text x="72" y="96" font-family="Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.6" fill="#8f4635">PM</text>
  <text x="111" y="96" font-family="Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.6" fill="#25231f">Forge</text>

  <text x="72" y="158" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2" fill="#6b655b">A PRACTICE GROUND FOR PRODUCT JUDGMENT</text>
  <rect x="72" y="177" width="54" height="2" fill="#b18a50"/>

  <text x="72" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="-2.6" fill="#25231f">Master the mess.</text>
  <text x="72" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="-1.8" fill="#25231f">Turn chaos into</text>
  <text x="72" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="-1.8" fill="#58654e">justified decisions.</text>

  <text x="72" y="472" font-family="Arial, sans-serif" font-size="17" fill="#4a463f">Practice evidence, projects, interviews, and the reasoning behind the call.</text>

  <g transform="translate(72 526)" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#6b655b">
    <text x="0" y="0">SIGNAL</text>
    <path d="M64 0 H120" stroke="#b18a50" stroke-width="1"/>
    <text x="136" y="0">DECISION</text>
    <path d="M232 0 H288" stroke="#b18a50" stroke-width="1"/>
    <text x="304" y="0">IMPACT</text>
  </g>

  <text x="1128" y="590" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#6b655b">Practice the decisions that matter.</text>

  <rect width="1200" height="630" filter="url(#grain)" opacity="0.55"/>
</svg>
