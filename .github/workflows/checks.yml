name: Product checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run test:portfolio
      - run: npm run test:interview-live
      - run: npm run test:platform
      - run: npm run platform:fuzz
      - run: npm run test:ai
      - run: npm run ai:eval
      - run: npm run test:auth
      - run: npm test
      - run: npm run test:deadlock
      - run: npm run test:sacred-no
      - run: npm run test:ghost-metric
      - run: npm run test:trojan-horse
      - run: node --import tsx scripts/check-invisible-wall.ts
      - run: npm run test:invisible-wall
      - run: npm run test:feature-factory
      - run: npm run test:silent-churn
      - run: npm run test:legacy-fracture
      - run: npm run test:pivot-point
      - run: npm run build
      - run: node scripts/deadlock-budgets.mjs
      - name: Check shared project browser flows
        env:
          PMFORGE_PROJECT_PREVIEW: 'true'
          PRODUCT_URL: http://localhost:3002
        run: |
          npm start -- -p 3002 > /tmp/pmforge-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent "$PRODUCT_URL/api/project-platform" > /dev/null; then break; fi
            sleep 1
          done
          node --import tsx scripts/verify-shared-platform.mjs
          node --import tsx scripts/verify-landing-final.mjs
          node --import tsx scripts/verify-interview-ux.mjs
          node --import tsx scripts/verify-interview-live.mjs
          node --import tsx scripts/verify-pass-two.mjs
          node --import tsx scripts/verify-release-surface.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-platform-verification
          path: docs/platform-verification/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interview-live-verification
          path: docs/interview-live-verification/
  deadlock-balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run deadlock:sim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadlock-balance-report
          path: docs/deadlock-verification/simulation.json

  ai-room-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Verify AI recovery without external inference
        env:
          PMFORGE_AI_MODE: free-pilot
          PMFORGE_AI_TEST_PROVIDER: mock
          PMFORGE_AI_ALLOWED_REGIONS: NP
          PMFORGE_AI_MAX_TURNS: '3'
          PMFORGE_AI_DAILY_SESSIONS_PER_USER: '20'
          PMFORGE_AI_MAX_CONCURRENT_SESSIONS: '20'
          PMFORGE_DATABASE_PATH: /tmp/pmforge-ai-ci.sqlite
          PMFORGE_PREVIEW_DIR: .next-ai
          PRODUCT_URL: http://localhost:3003
          VERIFY_OUTPUT: docs/ai-interview-release-verification
        run: |
          npm run dev -- --port 3003 > /tmp/pmforge-ai.log 2>&1 &
          AI_PID=$!
          trap 'kill "$AI_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent "$PRODUCT_URL/api/interview/ai" > /dev/null; then break; fi
            sleep 1
          done
          node --import tsx scripts/verify-interview-ai.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-interview-verification
          path: docs/ai-interview-release-verification/
